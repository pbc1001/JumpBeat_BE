spring:
  application:
    name: JumpBeat
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jumpbeat}
    username: ${DB_USERNAME:jumpbeat}
    password: ${DB_PASSWORD:jumpbeat-local-password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      base-path: /api/v1
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /docs
  api-docs:
    path: /api-docs

jumpbeat:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}

logging:
  level:
    org.hibernate.SQL: WARN
