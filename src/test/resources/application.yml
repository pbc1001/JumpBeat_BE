spring:
  datasource:
    url: jdbc:h2:mem:jumpbeat;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false

jumpbeat:
  frontend-origin: http://localhost:5173
  auth:
    access-token-secret: test-access-token-secret-with-at-least-32-bytes
    access-token-expiration-ms: 900000
    refresh-token-expiration-ms: 1209600000
    cookie-secure: false
