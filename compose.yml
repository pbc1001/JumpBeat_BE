services:
  postgres:
    image: postgres:17-alpine
    container_name: jumpbeat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jumpbeat
      POSTGRES_USER: jumpbeat
      POSTGRES_PASSWORD: jumpbeat-local-password
    ports:
      - "5432:5432"
    volumes:
      - jumpbeat-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jumpbeat -d jumpbeat"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  jumpbeat-postgres-data:
